```yaml
name: Portfolio CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


# =====================================================
# GLOBAL VARIABLES
# =====================================================

env:
  NODE_ENV: test

  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

  BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-backend
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-frontend


# =====================================================
# JOBS
# =====================================================

jobs:

  # ===================================================
  # BACKEND TEST
  # ===================================================

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test


  # ===================================================
  # FRONTEND TEST
  # ===================================================

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test


  # ===================================================
  # BACKEND BUILD
  # ===================================================

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    needs: backend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build || echo "No build step needed"


  # ===================================================
  # FRONTEND BUILD
  # ===================================================

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    needs: frontend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build


  # ===================================================
  # DOCKER BACKEND
  # ===================================================

  docker-backend:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - backend-build

    # Only push images on normal branch pushes.
    # Pull requests only run tests/builds.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "${BACKEND_IMAGE}:${GITHUB_REF_NAME}" \
            -t "${BACKEND_IMAGE}:${GITHUB_SHA::7}" \
            -t "${BACKEND_IMAGE}:latest" \
            backend

      - name: Push branch tag
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_REF_NAME}"

      - name: Push commit SHA tag
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA::7}"

      - name: Push latest tag
        run: |
          docker push "${BACKEND_IMAGE}:latest"


  # ===================================================
  # DOCKER FRONTEND
  # ===================================================

  docker-frontend:
    name: Build & Push Frontend Docker Image
    runs-on: ubuntu-latest

    needs:
      - frontend-test
      - frontend-build

    # Only push images on normal branch pushes.
    # Pull requests only run tests/builds.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t "${FRONTEND_IMAGE}:${GITHUB_REF_NAME}" \
            -t "${FRONTEND_IMAGE}:${GITHUB_SHA::7}" \
            -t "${FRONTEND_IMAGE}:latest" \
            frontend

      - name: Push branch tag
        run: |
          docker push "${FRONTEND_IMAGE}:${GITHUB_REF_NAME}"

      - name: Push commit SHA tag
        run: |
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA::7}"

      - name: Push latest tag
        run: |
          docker push "${FRONTEND_IMAGE}:latest"
```
