# =====================================================
# STAGES — the phases of the pipeline, run in order steps
# =====================================================
stages:
  - test
  - sonarqube
  - build
  - docker
  - security
  # - deploy  

# =====================================================
# GLOBAL VARIABLES — available to every job yes
# =====================================================
variables:
  NODE_ENV: "test"
  # HARBOR_PROJECT: "portfolio"
  # HARBOR_REGISTRY: "10.10.10.3"
  
  BACKEND_IMAGE: "$HARBOR_REGISTRY/$HARBOR_PROJECT/portfolio-backend"
  FRONTEND_IMAGE: "$HARBOR_REGISTRY/$HARBOR_PROJECT/portfolio-frontend"
  
  #BACKEND_IMAGE: "$HARBOR_USERNAME/portfolio-backend"     # DOCKERHUB_USERNAME -> HARBOR_USERNAME
  #FRONTEND_IMAGE: "$HARBOR_USERNAME/portfolio-frontend"

# =====================================================
# WORKFLOW — controls WHEN a pipeline runs at all
# =====================================================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# =====================================================
# REUSABLE TEMPLATE for Node jobs (test/build)
# =====================================================
.node_job:
  image: node:20-alpine
  cache:
    key:
      files:
        - $APP_DIR/package-lock.json
    paths:
      - $APP_DIR/node_modules/

# =====================================================
# STAGE 1: TEST
# =====================================================
backend-test:
  extends: .node_job
  stage: test
  variables:
    APP_DIR: backend
  script:
    - cd backend
    - npm ci
    - npx prisma generate
    - npm run lint
    - npm test
  rules:
    - changes:
        - backend/**/*

frontend-test:
  extends: .node_job
  stage: test
  variables:
    APP_DIR: frontend
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm test
  rules:
    - changes:
        - frontend/**/*

sonarqube-check:
  image: sonarsource/sonar-scanner-cli:latest
  stage: sonarqube
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner
      -Dsonar.projectKey=portfolio
      -Dsonar.sources=.
      -Dsonar.host.url=http://10.10.10.85:9000
      -Dsonar.login=$SONAR_TOKEN
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    


# =====================================================
# STAGE 2: BUILD
# =====================================================
frontend-build:
  extends: .node_job
  stage: build
  variables:
    APP_DIR: frontend
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/.next
    expire_in: 1 hour
  rules:
    - changes:
        - frontend/**/*

backend-build:
  extends: .node_job
  stage: build
  variables:
    APP_DIR: backend
  script:
    - cd backend
    - npm ci
    - npm run build || echo "no build step needed"
  artifacts:
    paths:
      - backend/dist
    expire_in: 1 hour
  rules:
    - changes:
        - backend/**/*





# =====================================================
.docker_build:
  stage: docker
  image: docker:25
  services:
    - name: docker:25-dind
      # command: ["--insecure-registry=10.10.10.80"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    # DOCKER_TLS_VERIFY: 1
    # DOCKER_CERT_PATH: "/certs/client"
    BUILDKIT_PROGRESS: plain
  before_script:
    - echo "=== checking cert mount ==="
    - ls -la /etc/docker/certs.d/ || echo "certs.d missing entirely"
    - ls -la /etc/docker/certs.d/harbor.local/ || echo "harbor.local dir missing"
    - cat /etc/docker/certs.d/harbor.local/ca.crt || echo "ca.crt missing"
    - echo "=== end check ==="
    # - docker info | grep -i "^ID\|^Name\|Containers:\|Images:"
 
    - echo "$HARBOR_PASSWORD" | docker login $HARBOR_REGISTRY -u "$HARBOR_USERNAME" --password-stdin
    # - docker buildx create --use --driver docker-container --name builder || true



        # login to Harbor (uses host Docker daemon via socket)
    # - echo "$HARBOR_PASSWORD" | docker login $HARBOR_REGISTRY -u "$HARBOR_USERNAME" --password-stdin

    # create buildx builder (uses host docker, NOT docker-container driver)
    # - docker buildx create --use --driver docker --name builder || true
    # - docker buildx inspect --bootstrap
    
docker-backend: 
  extends: .docker_build
  needs: ["backend-test"]
  script:
    - docker build -f "${CI_PROJECT_DIR}/backend/Dockerfile" -t "${BACKEND_IMAGE}:${CI_COMMIT_REF_SLUG}" -t "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}" -t "${BACKEND_IMAGE}:latest" "${CI_PROJECT_DIR}/backend"
    - docker push "${BACKEND_IMAGE}:${CI_COMMIT_REF_SLUG}"
    - docker push "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${BACKEND_IMAGE}:latest"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*

docker-frontend:
  extends: .docker_build
  needs: ["frontend-test"]
  script:
    - docker build -f "${CI_PROJECT_DIR}/frontend/Dockerfile" -t "${FRONTEND_IMAGE}:${CI_COMMIT_REF_SLUG}" -t "${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}" -t "${FRONTEND_IMAGE}:latest" "${CI_PROJECT_DIR}/frontend"
    - docker push "${FRONTEND_IMAGE}:${CI_COMMIT_REF_SLUG}"
    - docker push "${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${FRONTEND_IMAGE}:latest"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*



.trivy_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script:
    - apk add --no-cache ca-certificates
    - mkdir -p /usr/local/share/ca-certificates
    - echo "$CA_CERTIFICATE" | tr -d '\r' > /usr/local/share/ca-certificates/harbor-ca.crt
    - update-ca-certificates
  variables:
    TRIVY_USERNAME: "$HARBOR_USERNAME"
    TRIVY_PASSWORD: "$HARBOR_PASSWORD"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    key: trivy-db-cache
    paths:
      - .trivycache/
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    
trivy-backend:
  # stage: security
  # image:
  #   name: aquasec/trivy:latest
  #   entrypoint: [""]
  extends: .trivy_scan
  needs:
    - job: "docker-backend"
      optional: true
  script:
    # - trivy image --exit-code 1 --ignore-unfixed --format table --scanners vuln "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --format table --scanners vuln "${BACKEND_IMAGE}:${CI_COMMIT_REF_SLUG}"


trivy-frontend:
  # stage: security
  # image:
  #   name: aquasec/trivy:latest
  #   entrypoint: [""]
  extends: .trivy_scan
  needs:
    - job: "docker-frontend"
      optional: true
  script:
    # - trivy image --exit-code 1 --ignore-unfixed --format table --scanners vuln "${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --format table --scanners vuln "${FRONTEND_IMAGE}:${CI_COMMIT_REF_SLUG}"


